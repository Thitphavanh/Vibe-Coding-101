<header class="sticky top-0 z-50 bg-white shadow-sm">
    <nav class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <a href="{% url 'blog:index' %}" class="text-xl font-bold text-emerald-600">
            Vibe Coding 101
        </a>

        <div class="hidden md:flex items-center gap-8">
            <a href="{% url 'blog:index' %}" class="text-gray-600 hover:text-emerald-600 font-medium">หน้าแรก</a>
            <a href="{% url 'blog:post_list' %}" class="text-gray-600 hover:text-emerald-600 font-medium">บทความ</a>
            <a href="#" class="text-gray-600 hover:text-emerald-600 font-medium">เกี่ยวกับ</a>
            <a
                href="/admin/"
                class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700"
            >
                เข้าสู่ระบบแอดมิน
            </a>
        </div>

        <button
            id="navbar-toggle"
            type="button"
            class="md:hidden p-2 text-gray-600"
            aria-label="เปิด/ปิดเมนู"
            aria-expanded="false"
        >
            <svg id="navbar-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
            <svg id="navbar-icon-close" class="hidden w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </nav>

    <div id="navbar-menu" class="hidden md:hidden border-t border-gray-100 px-4 py-3 space-y-2">
        <a href="{% url 'blog:index' %}" class="block py-1.5 text-gray-600 hover:text-emerald-600 font-medium">หน้าแรก</a>
        <a href="{% url 'blog:post_list' %}" class="block py-1.5 text-gray-600 hover:text-emerald-600 font-medium">บทความ</a>
        <a href="#" class="block py-1.5 text-gray-600 hover:text-emerald-600 font-medium">เกี่ยวกับ</a>
        <a href="/admin/" class="block py-1.5 text-emerald-600 font-semibold">เข้าสู่ระบบแอดมิน</a>
    </div>
</header>

<script>
    (function () {
        var toggle = document.getElementById("navbar-toggle");
        var menu = document.getElementById("navbar-menu");
        var iconOpen = document.getElementById("navbar-icon-open");
        var iconClose = document.getElementById("navbar-icon-close");

        toggle.addEventListener("click", function () {
            var isOpen = !menu.classList.contains("hidden");
            menu.classList.toggle("hidden");
            iconOpen.classList.toggle("hidden");
            iconClose.classList.toggle("hidden");
            toggle.setAttribute("aria-expanded", String(!isOpen));
        });
    })();
</script>
